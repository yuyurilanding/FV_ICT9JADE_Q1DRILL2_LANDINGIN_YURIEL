<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 DRILL 2</title>
    <style>
        body{
            font-family: consolas;
        }
        section{
            background-color: aliceblue;
            padding: 10px;
            margin: 15px;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 2px rgba(157, 138, 138, 0.026);
        }
           input[type="submit"], select, textarea {
           width: 94%;
           padding: 15px;
           border: 1px solid white ;
           border-radius: 5px;
           text-align: center;
        }
        img{
            display: block;
            margin: auto;
            height: 100px;
            width: 100px;
            padding: 0px;
        }
        </style>
</head>
<body>
    <header>
        <h1> RATE A MOVIE</h1>    
        <br>
        <p> Say something about the content</p>
    </header>

    <section>
        <form action="">
            <img src="https://cdn-icons-png.flaticon.com/512/2798/2798007.png" alt="movie logo">
            <label for="movies">select a movie</label>
                <select id="movies"
                     <option value="m1">select</option>
                     <option value="m2">Spiderman: Brand new day</option>
                     <option value="m3">Insidious: out of the further</option>
                     <option value="m4">Obsession</option>
               </select>
               <br>
            <label for="genre"> Genre/s</label>
            <br>
            <input type="checkbox" id="genre1" name="genre1">
               <label for="genre1"> Action</label>
               
             <input type="checkbox" id="genre1" name="genre2">
               <label for="genre2"> Comedy</label>
             
             <input type="checkbox" id="genre1" name="genre3">
               <label for="genre3"> Horror</label>
               <br>
             <input type="checkbox" id="genre1" name="genre4">
               <label for="genre4"> Sci-fi</label>
               <br>
             <input type="checkbox" id="genre1" name="genre5">
               <label for="genre5"> Other</label>
               <br>
               <br>
           <label for="rate"> rating</label>
            <br>
            <input type="checkbox" id="rate1" name="rating">
               <label for="rate1">⭐</label>
              <input type="radio" id="rate1" name="rating">
               <label for="rate1">⭐⭐</label>
              <input type="radio" id="rate1" name="rating">
               <label for="rate1">⭐⭐⭐</label>
              <input type="radio" id="rate1" name="rating">
               <label for="rate1">⭐⭐⭐⭐</label>
                <input type="radio" id="rate1" name="rating">
               <label for="rate5">⭐⭐⭐⭐⭐</label>
            <br><br>
            <textarea id="" name="review" rows="4" cols="40"
            placeholder="movie review"></textarea>
            <br>
            <input type="submit" id="" name ="submit" name="submit"
            value="submit review">
            <br>
            For movie review tips, click <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review"
            target="_blank">here</a>
          </form>
    </section>
</body>
</html>
